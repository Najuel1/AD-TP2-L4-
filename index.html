<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TP2 - Historial de Recorrido</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="mapa.css" />
  </head>

  <body class="bg-light text-dark py-4">
    <div class="container" style="max-width: 600px">
      <h2 class="text-center mb-4">Historial de Recorrido</h2>
      <div id="mapa" class="mb-4 shadow-sm"></div>

      <div class="d-flex justify-content-center gap-2 mb-3">
        <button class="btn btn-success fw-bold" onclick="iniciarSegui()">
          Iniciar seguimiento
        </button>
        <button class="btn btn-danger fw-bold" onclick="pararSegui()">
          Detener seguimiento
        </button>
        <button class="btn btn-secondary fw-bold" onclick="limpiaHisto()">
          Limpiar historial
        </button>
      </div>

      <h4>Historial de Posiciones</h4>
      <ul id="lista-historial" class="list-group shadow-sm"></ul>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="app.js"></script>
  </body>
</html>
